  address: {
    street: "Travel Food Services Limited, Airline Building, 2nd Floor, CIAL",
    city: "Cochin",
    state: "Kerala",
    zip: "683111",
    country: "India"
  },
  photo: PHOTO_DATA,
  logo: LOGO_DATA,
  waMessage: "Hello Binu"
};
/* ===== END OF EDITABLE SECTION ===== */

const $ = id => document.getElementById(id);
const tel = value => String(value || "").replace(/[^\d+]/g, "");
const full = [CARD.firstName, CARD.lastName].filter(Boolean).join(" ");
const A = CARD.address;
const addr = [A.street, A.city, A.state, A.zip, A.country].filter(Boolean).join(", ");
const svgUri = value => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(value);
const monogram = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#0095da'/><stop offset='1' stop-color='#0b2a4a'/></linearGradient></defs><rect width='100' height='100' fill='url(#g)'/><text x='50' y='50' dy='.35em' text-anchor='middle' font-family='Georgia,serif' font-size='40' fill='#fff'>" + (CARD.firstName[0] || "") + (CARD.lastName[0] || "") + "</text></svg>";

/* vCard is created in memory and shared directly. It is NOT automatically downloaded. */
const vcardEscape = value => String(value || "")
  .replace(/\\/g, "\\\\")
  .replace(/\r?\n/g, "\\n")
  .replace(/;/g, "\\;")
  .replace(/,/g, "\\,");

const foldVCardLine = line => {
  const chunks = [];
  while (line.length > 72) {
    chunks.push(line.slice(0, 72));
    line = " " + line.slice(72);
  }
  chunks.push(line);
  return chunks.join("\r\n");
};

function buildVCard(card) {
  const address = card.address || {};
  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:" + vcardEscape(card.lastName) + ";" + vcardEscape(card.firstName) + ";;;",
    "FN:" + vcardEscape([card.firstName, card.lastName].filter(Boolean).join(" ")),
    "ORG:" + vcardEscape(card.company),
    "TITLE:" + vcardEscape(card.designation),
    "TEL;TYPE=CELL,VOICE:" + tel(card.mobile),
    "EMAIL;TYPE=INTERNET,WORK:" + vcardEscape(card.email),
    "URL:" + vcardEscape(card.website),
    "ADR;TYPE=WORK:;;" + [address.street, address.city, address.state, address.zip, address.country].map(vcardEscape).join(";")
  ];

  if (card.linkedin) {
    lines.push("item1.URL:" + vcardEscape(card.linkedin));
    lines.push("item1.X-ABLabel:LinkedIn");
  }

  const photoMatch = /^data:image\/(\w+);base64,([\s\S]+)$/.exec(card.photo || "");
  if (photoMatch) {
    const photoType = photoMatch[1].toUpperCase().replace("JPG", "JPEG");
    lines.push("PHOTO;ENCODING=b;TYPE=" + photoType + ":" + photoMatch[2]);
  }

  lines.push("END:VCARD");
  return lines.map(foldVCardLine).join("\r\n") + "\r\n";
}

let toastTimer;
function toast(message) {
  const element = $("toast");
  if (!element) return;
  element.textContent = message;
  element.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => element.classList.remove("on"), 4200);
}

function showShareUnavailableMessage() {
  const message = "Contact sharing is not available in this browser. Open this business card from its HTTPS website using Chrome on Android or Safari on iPhone. No contact file has been downloaded.";
  toast(message);
  window.alert(message);
}

/* ---------- Populate the card ---------- */
document.title = full + " | " + CARD.designation + ", " + CARD.company;
$("logo").src = CARD.logo;
$("photo").src = CARD.photo || svgUri(monogram);
$("photo").alt = "Portrait of " + full;
$("name").textContent = full;
$("role").textContent = CARD.designation;
$("company").textContent = CARD.company;
$("loc").textContent = CARD.location;

const mapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
$("call").href = $("rMobile").href = "tel:" + tel(CARD.mobile);
$("wa").href = "https://wa.me/" + tel(CARD.whatsapp || CARD.mobile).replace("+", "") + "?text=" + encodeURIComponent(CARD.waMessage);
$("mail").href = $("rMail").href = "mailto:" + CARD.email;
$("web").href = $("rWeb").href = CARD.website;
$("li").href = CARD.linkedin;
$("map").href = $("rMap").href = mapUrl;
$("vMobile").textContent = CARD.mobile;
$("vMail").textContent = CARD.email;
$("vWeb").textContent = CARD.website.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
$("vAddr").textContent = addr;
$("foot").textContent = "© " + new Date().getFullYear() + " " + CARD.company;

/* ---------- Cross-platform Save Contact ---------- */
/* One tap: the phone gets the contact card and offers to add it. No share sheet. */
$("save").addEventListener("click", () => {
  const fileName = full.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-") + ".vcf";
  const blob = new Blob([buildVCard(CARD)], { type: "text/x-vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast("Tap OPEN on the download, then Save.");
});
</script>
</body>
</html>
